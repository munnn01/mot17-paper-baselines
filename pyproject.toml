[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mot17-paper-baselines"
version = "0.1.0"
description = "Matched MOT17/x265 adaptations of official SCOPE and Zhao video preprocessing"
requires-python = ">=3.11,<3.13"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["models*", "losses*", "scripts*", "vcm_datasets*", "video_codecs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
